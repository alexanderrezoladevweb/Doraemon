<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enciclopedia de Doraemon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Press+Start+2P&family=Poppins:wght@400;500;600;700&family=Comic+Neue:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* =========================================================
   VARIABLES Y BASE
   ========================================================= */
:root{
  --blue:#0096e0; --blue-dark:#0b3d91; --navy:#0e2147; --red:#e53935; --yellow:#ffd23f; --neon:#29d4ff;
  --btn-bg:#0096e0; --btn-fg:#ffffff;
  --font-head:'Fredoka','Noto Sans JP',sans-serif;
  --font-body:'Poppins','Noto Sans JP',system-ui,sans-serif;
  --glass:rgba(255,255,255,.62); --glass-brd:rgba(255,255,255,.85);
  --shadow:0 10px 30px rgba(11,61,145,.16);
  --btn-radius:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--navy);min-height:100vh;line-height:1.5;
  background:
    radial-gradient(circle at 12% 8%,rgba(41,212,255,.35),transparent 40%),
    radial-gradient(circle at 90% 20%,rgba(255,210,63,.28),transparent 35%),
    radial-gradient(circle at 70% 95%,rgba(229,57,53,.14),transparent 40%),
    linear-gradient(160deg,#e6f6ff,#cde8ff 55%,#e9f3ff);
  background-attachment:fixed;
}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,.btn,.navbtn,.chip-h{font-family:var(--font-head)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--navy)}
:focus-visible{outline:3px solid var(--neon);outline-offset:2px}

/* =========================================================
   BOTONES PERSONALIZABLES
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--btn-bg);color:var(--btn-fg);padding:.6rem 1.2rem;border-radius:var(--btn-radius);
  font-weight:600;font-size:.95rem;border:2px solid transparent;
  transition:transform .18s ease,box-shadow .25s ease,filter .2s ease;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--navy);border-color:rgba(14,33,71,.12)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:.35rem .8rem;font-size:.82rem}
body[data-shape=pill]{--btn-radius:999px}
body[data-shape=round]{--btn-radius:14px}
body[data-shape=rect]{--btn-radius:5px}
body[data-shape=sharp]{--btn-radius:0}
body[data-shape=sharp] .btn{border-color:var(--navy)}
body[data-effect=shadow] .btn:not(.ghost){box-shadow:0 8px 20px color-mix(in srgb,var(--btn-bg) 55%,transparent)}
body[data-effect=neon] .btn:not(.ghost){
  border-color:color-mix(in srgb,var(--btn-bg) 40%,#fff);
  box-shadow:0 0 6px var(--btn-bg),0 0 18px color-mix(in srgb,var(--btn-bg) 70%,transparent),inset 0 0 8px rgba(255,255,255,.35);
  text-shadow:0 0 6px rgba(255,255,255,.6);
}

/* =========================================================
   CABECERA Y NAVEGACIÓN
   ========================================================= */
#top{
  position:fixed;inset:0 0 auto 0;height:64px;z-index:40;display:flex;align-items:center;gap:.75rem;padding:0 1rem;
  background:linear-gradient(90deg,rgba(0,150,224,.92),rgba(11,61,145,.92));backdrop-filter:blur(14px);
  color:#fff;box-shadow:0 4px 20px rgba(11,61,145,.3);border-bottom:3px solid var(--yellow);
}
#top .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
#top .brand .mini{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;overflow:hidden;flex:none;border:2px solid var(--yellow)}
#top .brand .mini img{width:100%;height:100%;object-fit:cover}
#top h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .bell{color:var(--yellow);margin-left:auto}
#top .collar{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:.35rem}

#mainNav{
  position:fixed;z-index:45;display:flex;gap:.35rem;padding:.4rem;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:var(--shadow);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:64px;padding:.45rem .6rem;border-radius:16px;
  font-size:.72rem;font-weight:600;color:var(--navy);transition:background .2s,color .2s,transform .2s;
}
.navbtn i{font-size:1.15rem}
.navbtn:hover{transform:translateY(-2px);background:rgba(0,150,224,.12)}
.navbtn.active{background:var(--btn-bg);color:var(--btn-fg)}
body[data-menu=top] #mainNav{top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
body[data-menu=top] .navbtn{flex-direction:row;color:#fff;font-size:.82rem;gap:.4rem;min-width:0}
body[data-menu=top] .navbtn.active{color:var(--btn-fg)}
body[data-menu=top] .navbtn i{font-size:.95rem}
body[data-menu=tl] #mainNav{left:14px;top:84px;flex-direction:column}
body[data-menu=tr] #mainNav{right:14px;top:84px;flex-direction:column}
body[data-menu=bottom] #mainNav{bottom:14px;left:50%;transform:translateX(-50%)}
body[data-menu=tl] main{padding-left:110px}
body[data-menu=tr] main{padding-right:110px}
body[data-menu=bottom] main{padding-bottom:110px}

/* =========================================================
   CONTENIDO
   ========================================================= */
main{max-width:1280px;margin:0 auto;padding:84px 1.25rem 90px;transition:padding .3s}
.hero{
  display:flex;align-items:center;gap:1.4rem;padding:1.3rem 1.5rem;border-radius:28px;margin-bottom:1.2rem;
  background:linear-gradient(120deg,rgba(0,150,224,.88),rgba(41,212,255,.7));color:#fff;
  box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.5);
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--yellow),transparent 70%);opacity:.5}
.avatar{width:110px;height:110px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:2.6rem;overflow:hidden;flex:none;border:5px solid #fff;box-shadow:0 0 0 4px var(--yellow),0 10px 24px rgba(0,0,0,.2);animation:float 4s ease-in-out infinite}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero h2{font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.15}
.hero p{opacity:.92;margin-top:.2rem}
.hero .counts{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.25);padding:.2rem .8rem;border-radius:99px;font-size:.82rem;font-weight:600;backdrop-filter:blur(6px)}
@keyframes float{50%{transform:translateY(-6px)}}

.toolbar{
  display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem;padding:.7rem;border-radius:20px;
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-brd);box-shadow:var(--shadow);
}
.search{flex:1 1 240px;position:relative}
.search i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--blue)}
.search input{width:100%;padding:.6rem .9rem .6rem 2.4rem;border-radius:14px;border:2px solid transparent;background:#fff;transition:border .2s,box-shadow .2s}
.search input:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 4px rgba(41,212,255,.25)}
.sel{padding:.6rem .8rem;border-radius:14px;border:2px solid transparent;background:#fff;max-width:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.1rem}
.card{
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-brd);border-radius:22px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
  transition:transform .25s,box-shadow .25s;animation:pop .45s both;
}
.card:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 18px 38px rgba(11,61,145,.25)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.thumb{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#bfe6ff,#fff4c2);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.06)}
.ph{font-size:2.6rem;color:var(--blue);opacity:.7}
.heart{position:absolute;top:.6rem;left:.6rem;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);color:#9aa7c4;display:grid;place-items:center;transition:transform .2s,color .2s}
.heart:hover{transform:scale(1.15)}
.heart.on{color:var(--red);animation:beat .4s}
@keyframes beat{50%{transform:scale(1.35)}}
.score{position:absolute;top:.6rem;right:.6rem;background:var(--yellow);color:var(--navy);font-family:var(--font-head);font-weight:700;padding:.15rem .65rem;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.18);font-size:.9rem}
.score::before{content:"\f0f3";font-family:"Font Awesome 6 Free";font-weight:900;margin-right:.3rem;color:var(--red);font-size:.75rem}
.cbody{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.cbody h3{font-size:1.1rem;line-height:1.2}
.cbody p{font-size:.85rem;color:#44557c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cbody small{color:#5d6d93;margin-top:auto;font-size:.78rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{background:rgba(0,150,224,.14);color:var(--blue-dark);padding:.1rem .6rem;border-radius:99px;font-size:.74rem;font-weight:600}
.chip.red{background:rgba(229,57,53,.14);color:#a3201d}
.chip.yel{background:rgba(255,210,63,.4);color:#6b5200}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:#5d6d93;background:var(--glass);border-radius:22px;border:2px dashed rgba(0,150,224,.35)}
.empty i{font-size:2.4rem;color:var(--blue);margin-bottom:.6rem;display:block}

/* =========================================================
   ACCIONES RÁPIDAS + BOLSILLO MÁGICO
   ========================================================= */
#fabs{position:fixed;z-index:44;bottom:18px;display:flex;flex-direction:column;gap:.6rem;align-items:center}
body[data-fab=br] #fabs{right:18px}
body[data-fab=bl] #fabs{left:18px}
body[data-menu=bottom] #fabs{bottom:100px}
.fab{width:50px;height:50px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s}
.fab:hover{transform:scale(1.12) rotate(6deg)}
.pocket{
  width:86px;height:46px;border-radius:0 0 86px 86px;background:#fff;border:4px solid var(--navy);border-top-width:6px;
  display:grid;place-items:center;color:var(--red);font-size:1.4rem;position:relative;box-shadow:0 8px 20px rgba(11,61,145,.35);
  transition:transform .2s;animation:bob 2.6s ease-in-out infinite;
}
.pocket::before{content:"";position:absolute;top:-12px;left:-6px;right:-6px;height:10px;border-radius:99px;background:var(--navy)}
.pocket:hover{transform:scale(1.1)}
.pocket.shake{animation:shake .9s}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-18deg) scale(1.1)}30%{transform:rotate(16deg) scale(1.15)}45%{transform:rotate(-14deg) scale(1.2)}60%{transform:rotate(12deg) scale(1.2)}80%{transform:scale(1.3)}}
.reveal{text-align:center}
.reveal .big{font-family:var(--font-head);font-size:1.8rem;color:var(--red);animation:tada .8s}
@keyframes tada{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.reveal img,.reveal .ph-big{width:min(260px,70%);aspect-ratio:1;object-fit:cover;border-radius:24px;margin:.8rem auto;box-shadow:var(--shadow);animation:tada .9s .1s both;display:block}
.ph-big{display:grid!important;place-items:center;background:linear-gradient(135deg,#bfe6ff,#fff4c2);font-size:4rem;color:var(--blue)}

/* =========================================================
   MODALES
   ========================================================= */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(14,33,71,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.overlay.open{opacity:1;visibility:visible}
#confirm{z-index:120}
.modal-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.93);border-radius:28px;padding:1.5rem;box-shadow:0 30px 70px rgba(0,0,0,.35);transform:translateY(30px) scale(.94);transition:transform .3s cubic-bezier(.2,1.3,.4,1);position:relative;border:1px solid #fff}
.modal-box.wide{width:min(860px,100%)}
.overlay.open .modal-box{transform:none}
.modal-box.small{width:min(420px,100%)}
.xbtn{position:sticky;float:right;top:0;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;z-index:2;transition:transform .2s}
.xbtn:hover{transform:rotate(90deg)}
.modal-box h2{font-size:1.5rem;margin-bottom:.8rem;padding-right:2.6rem}
.modal-box h3{font-size:1.05rem;margin:1.1rem 0 .5rem;color:var(--blue-dark)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:1rem}
.gallery .main{width:100%;max-height:340px;object-fit:contain;background:linear-gradient(135deg,#e1f3ff,#fff8d6);border-radius:20px}
.gallery .ph-main{height:200px;border-radius:20px;background:linear-gradient(135deg,#bfe6ff,#fff4c2);display:grid;place-items:center;font-size:3.4rem;color:var(--blue)}
.thumbs{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.thumbs .t{width:62px;height:62px;border-radius:12px;overflow:hidden;border:3px solid transparent;position:relative;cursor:pointer;flex:none;background:#eaf5ff}
.thumbs .t.sel{border-color:var(--btn-bg)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:.65rem;display:grid;place-items:center}
.link{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Formularios */
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
.field label,.lbl{font-weight:600;font-size:.85rem;color:var(--blue-dark)}
.field input[type=text],.field input:not([type]),.field input[type=date],.field select,.field textarea,.inp{
  padding:.55rem .8rem;border-radius:12px;border:2px solid #d3e6f7;background:#fff;width:100%;transition:border .2s,box-shadow .2s
}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 4px rgba(41,212,255,.2)}
.checklist{max-height:170px;overflow:auto;border:2px solid #d3e6f7;border-radius:12px;padding:.3rem;background:#fff}
.checklist label{display:flex;gap:.5rem;align-items:center;padding:.3rem .5rem;border-radius:8px;font-size:.9rem;cursor:pointer}
.checklist label:hover{background:#eaf5ff}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.box{background:rgba(0,150,224,.07);border-radius:16px;padding:.8rem;margin-bottom:.8rem}

/* Valoraciones */
.scorebox{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.bigscore{font-family:var(--font-head);font-size:2.6rem;font-weight:700;color:var(--blue);line-height:1}
.bigscore small{font-size:.9rem;color:#5d6d93}
.bars{flex:1;min-width:220px;display:grid;gap:.4rem}
.bar{display:grid;grid-template-columns:110px 1fr 48px;align-items:center;gap:.5rem;font-size:.82rem}
.bar .track{height:10px;background:#dcebf8;border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--blue));border-radius:99px;transition:width .6s}
.hist{display:grid;gap:.4rem;max-height:200px;overflow:auto}
.hist .h{display:flex;align-items:center;gap:.6rem;padding:.4rem .7rem;background:#fff;border-radius:12px;font-size:.84rem;flex-wrap:wrap}
.hist .h b{font-family:var(--font-head);color:var(--blue);font-size:1.05rem}
.hist .x{margin-left:auto;color:var(--red)}
.rform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem;align-items:end}
.rform .field{margin:0}

/* Ajustes */
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{padding:.4rem .9rem;border-radius:99px;background:#eaf5ff;border:2px solid transparent;font-size:.85rem;font-weight:600;transition:all .2s}
.opt.on{border-color:var(--btn-bg);background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--btn-bg) 25%,transparent)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .2s}
.swatch:hover{transform:scale(1.2)}
input[type=color]{width:46px;height:36px;border:2px solid #d3e6f7;border-radius:10px;padding:2px;background:#fff;cursor:pointer}

/* Toasts */
#toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:.5rem;width:min(92vw,420px)}
.toast{padding:.7rem 1rem;border-radius:14px;background:var(--navy);color:#fff;box-shadow:var(--shadow);animation:pop .3s both;display:flex;gap:.6rem;align-items:center}
.toast.err{background:var(--red)}
.toast.ok{background:#12a150}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:900px){#top h1{font-size:1rem}body[data-menu=top] #mainNav{position:fixed}}
@media(max-width:767px){
  /* En móvil el menú siempre es una barra inferior táctil */
  #mainNav,body[data-menu] #mainNav{top:auto!important;left:8px!important;right:8px!important;bottom:8px!important;transform:none!important;flex-direction:row!important;justify-content:space-around;border-radius:24px;background:rgba(255,255,255,.88)}
  body[data-menu] .navbtn{flex-direction:column!important;color:var(--navy)!important;font-size:.68rem;min-width:0;flex:1}
  body[data-menu] .navbtn.active{color:var(--btn-fg)!important}
  body[data-menu] .navbtn i{font-size:1.2rem!important}
  body[data-menu] main{padding:78px .8rem 110px!important}
  body[data-menu] #fabs{bottom:92px!important}
  .hero{flex-direction:column;text-align:center;padding:1.1rem}
  .avatar{width:92px;height:92px}
  .hero .counts{justify-content:center}
  .grid{grid-template-columns:repeat(2,1fr);gap:.7rem}
  .bar{grid-template-columns:90px 1fr 44px}
  .grid2{grid-template-columns:1fr}
  .modal-box{padding:1.1rem;border-radius:22px}
  #top .brand h1{max-width:60vw}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-shape="pill" data-effect="shadow" data-menu="top" data-fab="br">

<header id="top">
  <div class="brand">
    <div class="mini" id="miniAvatar"></div>
    <h1><span class="collar"></span><span id="brandTitle"></span></h1>
  </div>
  <i class="fa-solid fa-bell bell" aria-hidden="true"></i>
</header>

<nav id="mainNav" aria-label="Menu"></nav>

<main>
  <section class="hero" id="hero"></section>
  <section class="toolbar" id="toolbar">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" autocomplete="off"></div>
    <select id="sort" class="sel"></select>
    <select id="filter" class="sel"></select>
  </section>
  <section class="grid" id="list" aria-live="polite"></section>
</main>

<div id="fabs">
  <button class="fab" data-act="newEpisode" id="fabEp" title="+"><i class="fa-solid fa-film"></i></button>
  <button class="fab" data-act="newGadget" id="fabGa" title="+"><i class="fa-solid fa-plus"></i></button>
  <button class="pocket" id="pocketBtn" data-act="pocket" aria-label="Pocket"><i class="fa-solid fa-star"></i></button>
</div>

<div class="overlay" id="modal"><div class="modal-box" id="modalBox"><button class="xbtn" data-act="closeModal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><div id="modalBody"></div></div></div>
<div class="overlay" id="confirm"><div class="modal-box small" id="confirmBox"></div></div>
<div id="toasts"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =========================================================
   1. UTILIDADES
   ========================================================= */
const STORE = 'doraemon-encyclopedia-v1';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   3. ESTADO Y PERSISTENCIA (localStorage con manejo de errores)
   ========================================================= */
let S;                                  // estado global
const ui = { view: 'gadgets', q: '', sort: 'new', tag: '', type: '' };

const defaults = () => ({
  gadgets: [], episodes: [],
  settings: { lang: 'es', font: 'fredoka', btnShape: 'pill', btnEffect: 'shadow', btnBg: '#0096e0', btnFg: '#ffffff', menuPos: 'top', fabPos: 'br', avatar: '' },
});
const normR = a => (Array.isArray(a) ? a : []).filter(r => r && Number.isFinite(+r.overall)).map(r => {
  const o = { id: String(r.id || uid()), overall: +r.overall, date: r.date || new Date().toISOString() };
  [...GK, ...EK].forEach(k => { if (Number.isFinite(+r[k]) && r[k] !== null && r[k] !== '') o[k] = +r[k]; });
  return o;
});
function normalize(d) {
  const o = defaults();
  Object.assign(o.settings, d.settings || {});
  o.gadgets = (Array.isArray(d.gadgets) ? d.gadgets : []).filter(g => g && g.name).map(g => ({
    id: String(g.id || uid()), name: String(g.name), desc: String(g.desc || ''), utility: String(g.utility || ''),
    images: Array.isArray(g.images) ? g.images.filter(x => typeof x === 'string') : [],
    tags: Array.isArray(g.tags) ? g.tags.map(String) : [], fav: !!g.fav, ratings: normR(g.ratings), created: +g.created || Date.now(),
  }));
  const ids = new Set(o.gadgets.map(g => g.id));
  o.episodes = (Array.isArray(d.episodes) ? d.episodes : []).filter(e => e && e.title).map(e => ({
    id: String(e.id || uid()), title: String(e.title), type: TYPES.includes(e.type) ? e.type : 'classic', date: String(e.date || ''),
    notes: String(e.notes || ''), gadgets: (Array.isArray(e.gadgets) ? e.gadgets.map(String) : []).filter(id => ids.has(id)),
    ratings: normR(e.ratings), created: +e.created || Date.now(),
  }));
  return o;
}
function seed() {
  const s = defaults(); const now = Date.now();
  [['Hélice de bambú', 'Pequeña hélice para la cabeza que permite volar.', 'Transporte personal por el aire, ligero y siempre a mano.', ['transporte']],
   ['Puerta mágica', 'Una puerta que lleva a cualquier lugar.', 'Viajes instantáneos a cualquier sitio que imagines.', ['transporte']],
   ['Pan de la memoria', 'Pan que graba lo que estudias.', 'Se estampa el texto en el pan y, al comerlo, se memoriza.', ['estudio']],
   ['Gelatina traductora', 'Permite entender cualquier idioma.', 'Comunicación con cualquier persona o criatura.', ['comunicación']],
  ].forEach(([name, desc, utility, tags], i) => s.gadgets.push({ id: uid() + i, name, desc, utility, images: [], tags, fav: false, ratings: [], created: now + i }));
  return s;
}
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { S = normalize(JSON.parse(raw)); return; } }
  catch (e) { console.warn('Lectura de localStorage fallida', e); }
  S = seed();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); return true; }
  catch (e) { toast(t('err_quota'), 'err'); console.warn(e); return false; }
}
/** Ejecuta una mutación y revierte si no se pudo guardar. */
function commit(mut) {
  const snap = JSON.stringify(S);
  mut();
  if (!save()) { S = JSON.parse(snap); return false; }
  return true;
}

/* =========================================================
   4. CONSULTAS Y ESTADÍSTICAS
   ========================================================= */
const gById = id => S.gadgets.find(g => g.id === id);
const eById = id => S.episodes.find(e => e.id === id);
const episodesOf = gid => S.episodes.filter(e => e.gadgets.includes(gid));
const gadgetsOf = e => e.gadgets.map(gById).filter(Boolean);
function stats(item, keys) {
  const r = item.ratings || [];
  const o = { count: r.length, overall: mean(r.map(x => x.overall)) };
  keys.forEach(k => o[k] = mean(r.map(x => x[k]).filter(v => typeof v === 'number')));
  return o;
}
const avgOf = (item, kind) => stats(item, kind === 'g' ? GK : EK).overall;
function antiq(item, kind) {
  const ts = kind === 'g' ? episodesOf(item.id).map(e => Date.parse(e.date)).filter(Number.isFinite) : (Number.isFinite(Date.parse(item.date)) ? [Date.parse(item.date)] : []);
  return ts.length ? Math.min(...ts) : item.created;
}
function sortItems(arr, kind) {
  const name = x => norm(kind === 'g' ? x.name : x.title);
  const cmp = {
    new: (a, b) => b.created - a.created,
    antiq_new: (a, b) => antiq(b, kind) - antiq(a, kind),
    antiq_old: (a, b) => antiq(a, kind) - antiq(b, kind),
    az: (a, b) => name(a).localeCompare(name(b)), za: (a, b) => name(b).localeCompare(name(a)),
    best: (a, b) => (avgOf(b, kind) ?? -1) - (avgOf(a, kind) ?? -1),
    worst: (a, b) => (avgOf(a, kind) ?? 99) - (avgOf(b, kind) ?? 99),
  }[ui.sort];
  return arr.slice().sort(cmp);
}
function listGadgets(favOnly) {
  const q = norm(ui.q); let a = S.gadgets.filter(g => !favOnly || g.fav);
  if (ui.tag) a = a.filter(g => g.tags.some(x => norm(x) === norm(ui.tag)));
  if (q) a = a.filter(g => norm([g.name, g.desc, g.utility, g.tags.join(' '), episodesOf(g.id).map(e => e.title).join(' ')].join(' ')).includes(q));
  return sortItems(a, 'g');
}
function listEpisodes() {
  const q = norm(ui.q); let a = S.episodes.slice();
  if (ui.type) a = a.filter(e => e.type === ui.type);
  if (q) a = a.filter(e => norm([e.title, e.notes, gadgetsOf(e).map(g => g.name + ' ' + g.utility).join(' ')].join(' ')).includes(q));
  return sortItems(a, 'e');
}

function saveGadget(f) {
  const fd = new FormData(f), id = f.dataset.id, name = String(fd.get('name')).trim();
  if (!name) return toast(t('err_name'), 'err');
  const tags = [...new Map(String(fd.get('tags')).split(',').map(x => x.trim()).filter(Boolean).map(x => [norm(x), x])).values()];
  const eps = fd.getAll('e'); let gid = id;
  const ok = commit(() => {
    let g = id ? gById(id) : null;
    if (!g) { g = { id: uid(), fav: false, ratings: [], created: Date.now() }; S.gadgets.push(g); gid = g.id; }
    Object.assign(g, { name, desc: String(fd.get('desc')).trim(), utility: String(fd.get('utility')).trim(), tags, images: formImgs.slice() });
    S.episodes.forEach(e => {
      const has = e.gadgets.includes(g.id), want = eps.includes(e.id);
      if (want && !has) e.gadgets.push(g.id); if (!want && has) e.gadgets = e.gadgets.filter(x => x !== g.id);
    });
  });
  if (ok) { toast(t('saved')); render(); openGadget(gid); }
}
function saveEpisode(f) {
  const fd = new FormData(f), id = f.dataset.id, title = String(fd.get('title')).trim();
  if (!title) return toast(t('err_name'), 'err');
  const sel = fd.getAll('g'); let eid = id;
  const ok = commit(() => {
    // 1) Inventos nuevos creados en el acto: se registran en la lista global
    const created = pending.map(p => { const g = { id: uid(), name: p.name, desc: p.desc, utility: '', images: [], tags: [], fav: false, ratings: [], created: Date.now() }; S.gadgets.push(g); return g.id; });
    let e = id ? eById(id) : null;
    if (!e) { e = { id: uid(), ratings: [], created: Date.now(), gadgets: [] }; S.episodes.push(e); eid = e.id; }
    Object.assign(e, { title, type: String(fd.get('type')), date: String(fd.get('date')), notes: String(fd.get('notes')).trim(), gadgets: [...new Set([...sel, ...created])] });
  });
  if (ok) { pending = []; toast(t('saved')); render(); openEpisode(eid); }
}
function addRating(f) {
  const { kind, id } = f.dataset, item = kind === 'g' ? gById(id) : eById(id), keys = kind === 'g' ? GK : EK, fd = new FormData(f);
  const num = n => { const v = String(fd.get(n) || '').trim().replace(',', '.'); return v === '' ? null : Number(v); };
  const bad = v => v == null || !Number.isFinite(v) || v < 1 || v > 10;
  const ov = num('overall'); if (bad(ov)) return toast(t('r_invalid'), 'err');
  const r = { id: uid(), overall: round2(ov), date: new Date().toISOString() };
  for (const k of keys) { const v = num(k); if (v == null) continue; if (bad(v)) return toast(t('r_invalid'), 'err'); r[k] = round2(v); }
  if (commit(() => item.ratings.push(r))) { toast(t('rated')); render(); kind === 'g' ? openGadget(id) : openEpisode(id); }
}

/* =========================================================
   10. IMÁGENES (redimensionado + Base64 con control de errores)
   ========================================================= */
function fileToDataURL(file, max = 900, quality = .75, keepAlpha = false) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('type'));
    if (file.size > 15 * 1024 * 1024) return rej(new Error('big'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('img'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        if (!keepAlpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
        x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL(keepAlpha ? 'image/webp' : 'image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  <h3>${esc(t('set_bg'))} / ${esc(t('set_fg'))}</h3>
  <div class="row"><label class="row" style="gap:.4rem">${esc(t('set_bg'))} <input type="color" data-color="btnBg" value="${s.btnBg}"></label>
    <label class="row" style="gap:.4rem">${esc(t('set_fg'))} <input type="color" data-color="btnFg" value="${s.btnFg}"></label></div>
  <div class="row" style="margin-top:.6rem"><span class="lbl">${esc(t('set_presets'))}</span>${PRESETS.map(([b, f], i) => `<button type="button" class="swatch" data-act="preset" data-i="${i}" style="background:${b};box-shadow:0 0 0 3px ${f} inset,0 2px 8px rgba(0,0,0,.25)" aria-label="preset ${i + 1}"></button>`).join('')}</div>
  <h3>${esc(t('set_menu'))}</h3><div class="opts">${opt('menuPos', 'top', t('menu_top'))}${opt('menuPos', 'tl', t('menu_tl'))}${opt('menuPos', 'tr', t('menu_tr'))}${opt('menuPos', 'bottom', t('menu_bottom'))}</div>
  <small style="color:#5d6d93">${esc(t('set_menu_note'))}</small>
  <h3>${esc(t('set_fab'))}</h3><div class="opts">${opt('fabPos', 'br', t('fab_br'))}${opt('fabPos', 'bl', t('fab_bl'))}</div>
  <h3>${esc(t('set_data'))}</h3>
  <div class="row"><button class="btn sm" data-act="export"><i class="fa-solid fa-download"></i> ${esc(t('exp'))}</button>
    <button class="btn ghost sm" data-act="import"><i class="fa-solid fa-upload"></i> ${esc(t('imp'))}</button>
    <button class="btn danger sm" data-act="reset"><i class="fa-solid fa-trash"></i> ${esc(t('reset'))}</button></div>
  <small style="color:#5d6d93;display:block;margin-top:.5rem">${esc(t('storage'))}: ${kb} KB / ~5 MB</small>`, { wide: true, keepScroll: keep });
}

function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'doraemon-encyclopedia', version: 1, exported: new Date().toISOString(), ...S }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `doraemon-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  const fr = new FileReader();
  fr.onerror = () => toast(t('import_err'), 'err');
  fr.onload = () => {
    let d; try { d = JSON.parse(fr.result); if (!d || (!Array.isArray(d.gadgets) && !Array.isArray(d.episodes))) throw 0; d = normalize(d); } catch { return toast(t('import_err'), 'err'); }
    openModal(`<h2>${esc(t('import_title'))}</h2><p>${d.gadgets.length} ${t('c_gadgets')} · ${d.episodes.length} ${t('c_episodes')}</p>
      <div class="row end"><button class="btn ghost" data-act="closeModal">${esc(t('cancel'))}</button><button class="btn" id="mergeBtn">${esc(t('import_merge'))}</button><button class="btn danger" id="replBtn">${esc(t('import_replace'))}</button></div>`);
    $('#replBtn').onclick = () => { if (commit(() => { S = d; })) { toast(t('import_ok')); closeModal(); render(); } };
    $('#mergeBtn').onclick = () => {
      if (commit(() => {
        const gi = new Set(S.gadgets.map(g => g.id)), ei = new Set(S.episodes.map(e => e.id));
        d.gadgets.forEach(g => { if (!gi.has(g.id)) S.gadgets.push(g); }); d.episodes.forEach(e => { if (!ei.has(e.id)) S.episodes.push(e); });
      })) { toast(t('import_ok')); closeModal(); render(); }
    };
  };
  fr.readAsText(file);
}

/* =========================================================
   13. EVENTOS (delegación)
   ========================================================= */
const ACTS = {
  nav: d => { if (d.v === 'settings') return openSettings(); ui.view = d.v; ui.tag = ''; ui.type = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  closeModal, pocket,
  openGadget: d => openGadget(d.id), openEpisode: d => openEpisode(d.id),
  galleryImg: d => openGadget(d.id, +d.i),
  newGadget: () => openGadgetForm(), newEpisode: () => openEpisodeForm(),
  editGadget: d => openGadgetForm(d.id), editEpisode: d => openEpisodeForm(d.id),
  fav: d => { const g = gById(d.id); if (g && commit(() => { g.fav = !g.fav; })) { render(); if (d.reopen) openGadget(d.id); } },
  delGadget: async d => { const g = gById(d.id); if (g && await confirmBox(t('confirm_del', { n: g.name }))) if (commit(() => { S.gadgets = S.gadgets.filter(x => x.id !== d.id); S.episodes.forEach(e => e.gadgets = e.gadgets.filter(x => x !== d.id)); })) { toast(t('deleted')); closeModal(); render(); } },
  delEpisode: async d => { const e = eById(d.id); if (e && await confirmBox(t('confirm_del', { n: e.title }))) if (commit(() => { S.episodes = S.episodes.filter(x => x.id !== d.id); })) { toast(t('deleted')); closeModal(); render(); } },
  delRating: d => { const it = d.kind === 'g' ? gById(d.id) : eById(d.id); if (it && commit(() => { it.ratings = it.ratings.filter(r => r.id !== d.rid); })) { render(); d.kind === 'g' ? openGadget(d.id) : openEpisode(d.id); } },
  rmImg: d => { formImgs.splice(+d.i, 1); renderThumbs(); },
  addUrl: () => { const i = $('#imgUrl'), v = i.value.trim(); if (!/^https?:\/\/\S+$/i.test(v)) return toast(t('err_url'), 'err'); formImgs.push(v); i.value = ''; renderThumbs(); },
  addPending: () => { const n = $('#newGName'), name = n.value.trim(); if (!name) return toast(t('err_name'), 'err'); pending.push({ name, desc: $('#newGDesc').value.trim() }); n.value = ''; $('#newGDesc').value = ''; renderPending(); },
  rmPending: d => { pending.splice(+d.i, 1); renderPending(); },
  setOpt: d => { const sc = $('#modalBox').scrollTop; S.settings[d.key] = d.val; save(); render(); openSettings(true); $('#modalBox').scrollTop = sc; },
  preset: d => { const sc = $('#modalBox').scrollTop;[S.settings.btnBg, S.settings.btnFg] = PRESETS[+d.i]; save(); applySettings(); openSettings(true); $('#modalBox').scrollTop = sc; },
  rmAvatar: () => { S.settings.avatar = ''; save(); render(); openSettings(true); },
  export: exportData, import: () => { $('#importFile').value = ''; $('#importFile').click(); },
  reset: async () => { if (await confirmBox(t('reset_confirm'))) { const lang = S.settings.lang; try { localStorage.removeItem(STORE); } catch {} S = defaults(); S.settings.lang = lang; save(); closeModal(); render(); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  if (el.dataset.act === 'fav') e.stopPropagation();
  ACTS[el.dataset.act]?.(el.dataset);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#confirm').classList.contains('open')) $('#cNo').click(); else closeModal(); }
  if (e.key === 'Enter' && e.target.matches?.('.card[data-act]')) ACTS[e.target.dataset.act]?.(e.target.dataset);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  ({ gadget: saveGadget, episode: saveEpisode, rating: addRating })[f.dataset.form](f);
});
document.addEventListener('input', e => {
  const t_ = e.target;
  if (t_.id === 'q') { ui.q = t_.value; renderList(); }
  else if (t_.dataset.color) { S.settings[t_.dataset.color] = t_.value; applySettings(); save(); }
  else if (t_.dataset.filter) { const q = norm(t_.value); document.querySelectorAll('#' + t_.dataset.filter + ' label').forEach(l => l.classList.toggle('hidden', !l.dataset.s.includes(q))); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'sort') { ui.sort = el.value; renderList(); }
  else if (el.id === 'filter') { ui[ui.view === 'episodes' ? 'type' : 'tag'] = el.value; renderList(); }
  else if (el.id === 'imgFile') { for (const f of el.files) { try { formImgs.push(await fileToDataURL(f)); } catch (x) { imgErr(x); } } renderThumbs(); el.value = ''; }
  else if (el.id === 'avatarFile' && el.files[0]) { try { S.settings.avatar = await fileToDataURL(el.files[0], 500, .85, true); if (!save()) S.settings.avatar = ''; render(); openSettings(true); } catch (x) { imgErr(x); } }
  else if (el.id === 'importFile' && el.files[0]) importData(el.files[0]);
});
// Imágenes rotas (URL caída): se sustituyen por un icono
document.addEventListener('error', e => {
  if (e.target.tagName !== 'IMG') return;
  const ph = document.createElement('i'); ph.className = 'fa-solid fa-image ph'; e.target.replaceWith(ph);
}, true);

/* =========================================================
   14. ARRANQUE
   ========================================================= */
load(); render();
</script>
</body>
</html>
